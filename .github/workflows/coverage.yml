name: Coverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FILESERVER_ROOT: /tmp/auto-ingest/fileserver
      HOT_STORAGE_ROOT: /tmp/auto-ingest/hot
      COLD_STORAGE_ROOT: /tmp/auto-ingest/cold
      AUDIO_ROOT: /tmp/auto-ingest/audio
      DASHCAM_ROOT: /tmp/auto-ingest/dashcam
      BODYCAM_ROOT: /tmp/auto-ingest/bodycam
      TRANSCRIPT_ROOT: /tmp/auto-ingest/transcripts
      NEXTCLOUD_ROOT: /tmp/auto-ingest/nextcloud
      STATE_ROOT: /tmp/auto-ingest/state
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare portable roots
        run: |
          mkdir -p "$FILESERVER_ROOT" "$HOT_STORAGE_ROOT" "$COLD_STORAGE_ROOT" \
                   "$AUDIO_ROOT" "$DASHCAM_ROOT" "$BODYCAM_ROOT" \
                   "$TRANSCRIPT_ROOT" "$NEXTCLOUD_ROOT" "$STATE_ROOT"
          touch "$FILESERVER_ROOT/.keep" "$HOT_STORAGE_ROOT/.keep" "$COLD_STORAGE_ROOT/.keep"

      - name: Install coverage test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.6" "PyYAML>=6.0" "neo4j>=5.24" \
                      "fastapi" "python-multipart" "httpx" "numpy" \
                      "opencv-python-headless" "pillow" "pytest>=8.0" \
                      "pytest-cov>=6.0" "pytest-timeout>=2.3" "pydantic-settings"

      - name: Run branch coverage suite
        run: >-
          python -m pytest tests/ -q --timeout=60
          -m "not integration and not ml and not e2e and not destructive"
          --cov --cov-branch --cov-report=term-missing --cov-report=json:coverage.json

      - name: Build per-function coverage inventory
        run: >-
          python tools/coverage_audit.py coverage.json
          --output coverage-functions.json
          --min-total 0 --min-function 0 --top 100

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: |
            coverage.json
            coverage-functions.json

      # This becomes the final hard gate after the deficit is eliminated:
      # python tools/coverage_audit.py coverage.json --min-total 90 --min-function 90
