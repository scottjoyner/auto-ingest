name: Coverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test-password-123
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password-123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      FILESERVER_ROOT: /tmp/auto-ingest/fileserver
      HOT_STORAGE_ROOT: /tmp/auto-ingest/hot
      COLD_STORAGE_ROOT: /tmp/auto-ingest/cold
      AUDIO_ROOT: /tmp/auto-ingest/audio
      DASHCAM_ROOT: /tmp/auto-ingest/dashcam
      BODYCAM_ROOT: /tmp/auto-ingest/bodycam
      TRANSCRIPT_ROOT: /tmp/auto-ingest/transcripts
      NEXTCLOUD_ROOT: /tmp/auto-ingest/nextcloud
      STATE_ROOT: /tmp/auto-ingest/state
      NEO4J_TEST_URI: bolt://127.0.0.1:7687
      NEO4J_TEST_USER: neo4j
      NEO4J_TEST_PASSWORD: test-password-123
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-password-123
      NEO4J_DB: neo4j
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare portable roots
        run: |
          mkdir -p "$FILESERVER_ROOT" "$HOT_STORAGE_ROOT" "$COLD_STORAGE_ROOT" \
                   "$AUDIO_ROOT" "$DASHCAM_ROOT" "$BODYCAM_ROOT" \
                   "$TRANSCRIPT_ROOT" "$NEXTCLOUD_ROOT" "$STATE_ROOT"
          touch "$FILESERVER_ROOT/.keep" "$HOT_STORAGE_ROOT/.keep" "$COLD_STORAGE_ROOT/.keep"

      - name: Snapshot exact PR source
        run: |
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude='__pycache__' \
            --exclude='*.mp4' \
            --exclude='*.mov' \
            --exclude='*.wav' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.png' \
            --exclude='*.zip' \
            --exclude='*.tar.gz' \
            -czf /tmp/source-snapshot.tar.gz .

      - name: Install coverage test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.6" "PyYAML>=6.0" "neo4j>=5.24" \
                      "fastapi" "python-multipart" "httpx" "numpy" "pandas" \
                      "opencv-python-headless" "pillow" "moviepy==1.0.3" "pytest>=8.0" \
                      "pytest-cov>=6.0" "pytest-timeout>=2.3" "pydantic-settings"

      - name: Run fast branch coverage suite
        run: >-
          python -m pytest tests/ -q --timeout=60
          -m "not integration and not ml and not e2e and not destructive"
          --cov --cov-branch --cov-report=

      - name: Add real Neo4j integration coverage
        run: >-
          python -m pytest tests/integration -q --timeout=60 -m integration
          --cov --cov-branch --cov-append --cov-report=

      - name: Render combined coverage report
        run: |
          coverage report -m
          coverage json -o coverage.json

      - name: Build per-function coverage inventory
        run: >-
          python tools/coverage_audit.py coverage.json
          --output coverage-functions.json
          --min-total 0 --min-function 0 --top 100

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          if-no-files-found: warn
          path: |
            coverage.json
            coverage-functions.json
            /tmp/source-snapshot.tar.gz

      # Final hard gate after the deficit is eliminated:
      # python tools/coverage_audit.py coverage.json --min-total 90 --min-function 90
