name: Speaker Coverage

on:
  pull_request:

jobs:
  speaker-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy PyYAML pytest pytest-cov pytest-timeout soundfile torch torchaudio
      - name: Run speaker coverage
        run: |
          python -m pytest tests/test_global_speaker_pure_coverage.py tests/test_global_speaker_cluster_coverage.py -q -m ml --timeout=60 --cov=auto_ingest.diarize.link_global_speakers --cov-branch --cov-report=term-missing --cov-report=json:speaker-coverage.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speaker-coverage
          path: speaker-coverage.json
          if-no-files-found: warn
