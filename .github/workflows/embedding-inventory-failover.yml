name: Embedding Model Inventory Failover (Research)

on:
  push:
    branches:
      - fix/embedding-empty-inventory-failover-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-model-listing-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only lint
        run: python -m pip install 'ruff>=0.6,<1'
      - name: Test empty primary, offline providers, malformed registry, and no inference
        run: python -m unittest discover -s tests -p 'test_embedding_endpoint_inventory.py' -v
      - name: Lint resolver and acceptance tests
        run: ruff check scripts/get_embedding_endpoint.py tests/test_embedding_endpoint_inventory.py
      - name: Enforce GET-only and bounded model-list behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('scripts/get_embedding_endpoint.py').read_text()
          assert 'MAX_INVENTORY_BYTES = 65_536' in src
          assert 'method="GET"' in src
          assert 'inventory.get("data")' in src
          assert 'bool(item["id"].strip())' in src
          for bad in ('method="POST"', '/v1/chat/completions', 'subprocess', 'os.system('):
              assert bad not in src, bad
          print("Read-only model listing only; no execution/source/admission claim.")
          PY
