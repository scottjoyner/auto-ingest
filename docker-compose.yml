# Auto-Ingest Docker Compose
# Production authority model:
#   ingest-cron   = the one recurring ingest/sync scheduler
#   ingest-worker = resource-aware opportunistic worker using fenced orchestration
#   content-*     = independent content workflow
# Production containers execute the tested image contents; source code is NOT
# bind-mounted over /app. Mutable worker state lives under /state.

services:
  ingest-worker:
    build: .
    image: auto-ingest:latest
    container_name: auto-ingest-worker
    command:
      - bash
      - -c
      - >-
        python3 -m auto_ingest.operations schema-ensure &&
        exec python3 -m auto_ingest.worker_loop
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DROP_ROOT: ${DROP_ROOT}
      AUDIO_ROOT: ${AUDIO_ROOT}
      DASHCAM_ROOT: ${DASHCAM_ROOT}
      BODYCAM_ROOT: ${BODYCAM_ROOT}
      TRANSCRIPT_ROOT: ${TRANSCRIPT_ROOT}
      HOT_STORAGE_ROOT: ${HOT_STORAGE_ROOT:-/nas1}
      STATE_ROOT: /state
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DB: ${NEO4J_DB}
      WORKER_LEASE_TTL_SEC: ${WORKER_LEASE_TTL_SEC:-300}
      WORKER_HEARTBEAT_SEC: ${WORKER_HEARTBEAT_SEC:-30}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      MIN_MEMORY_AVAILABLE_MB: ${MIN_MEMORY_AVAILABLE_MB:-2048}
      MIN_DISK_FREE_GB: ${MIN_DISK_FREE_GB:-20}
      MAX_LOAD_PER_CPU: ${MAX_LOAD_PER_CPU:-0.60}
    volumes:
      - auto-ingest-state:/state
      - ${NAS_ROOT}:/nas
      - ${NAS1_ROOT:-/media/scott/SSD_4TB}:/nas1
      - ${NAS2_ROOT:-/media/scott/NAS5}:/nas2
    networks:
      - auto-ingest-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -m auto_ingest.readiness >/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  content-service:
    build: .
    image: auto-ingest:latest
    container_name: content-generation-service
    command: ["bash", "-c", "while true; do /usr/local/bin/content-os status; sleep 1800; done"]
    restart: unless-stopped
    environment:
      CONTENT_OS_LLM_BASE_URL: ${CONTENT_OS_LLM_BASE_URL}
      CONTENT_OS_LLM_API_KEY: ${CONTENT_OS_LLM_API_KEY}
      CONTENT_OS_LLM_MODEL: ${CONTENT_OS_LLM_MODEL}
      CONTENT_OS_LLM_TEMPERATURE: ${CONTENT_OS_LLM_TEMPERATURE}
      CONTENT_OS_LLM_MAX_TOKENS: ${CONTENT_OS_LLM_MAX_TOKENS}
    networks:
      - auto-ingest-net

  # The one recurring authority for sync/full/dashcam ingest.
  ingest-cron:
    build: .
    image: auto-ingest:latest
    container_name: auto-ingest-cron
    entrypoint: ["/app/deploy/start-cron.sh"]
    restart: unless-stopped
    environment:
      CRON_FILE: /app/deploy/cron/ingest.crontab
      SCHEMA_ENSURE: "1"
      STATE_ROOT: /state
      SCAN_ROOTS: ${SCAN_ROOTS}
      AUDIO_ROOT: ${AUDIO_ROOT}
      DASHCAM_ROOT: ${DASHCAM_ROOT}
      BODYCAM_ROOT: ${BODYCAM_ROOT}
      TRANSCRIPT_ROOT: ${TRANSCRIPT_ROOT}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DB: ${NEO4J_DB}
    volumes:
      - auto-ingest-state:/state
      - ${NAS_ROOT}:/nas
      - ${NAS1_ROOT:-/media/scott/SSD_4TB}:/nas1
      - ${NAS2_ROOT:-/media/scott/NAS5}:/nas2
    networks:
      - auto-ingest-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -m auto_ingest.readiness >/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  content-cron:
    build: .
    image: auto-ingest:latest
    container_name: content-generation-cron
    entrypoint: ["/app/deploy/start-cron.sh"]
    restart: unless-stopped
    environment:
      CRON_FILE: /app/deploy/cron/content_generation.crontab
      CONTENT_OS_LLM_BASE_URL: ${CONTENT_OS_LLM_BASE_URL}
      CONTENT_OS_LLM_API_KEY: ${CONTENT_OS_LLM_API_KEY}
      CONTENT_OS_LLM_MODEL: ${CONTENT_OS_LLM_MODEL}
    networks:
      - auto-ingest-net

volumes:
  auto-ingest-state:

networks:
  auto-ingest-net:
    driver: bridge
