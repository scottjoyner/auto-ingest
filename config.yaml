# auto-ingest configuration
# Machine-specific profiles may contain explicit fleet endpoints. The generic
# `any` profile must stay portable and safe for CI/new hosts.

machine_paths:
  # x1-370 (home Tailscale node — Neo4j server lives here)
  x1-370:
    fileserver_root: /media/scott/SSD_4TB/fileserver
    neo4j_uri: bolt://100.64.43.123:7687
    neo4j_user: neo4j
    neo4j_password: ${NEO4J_PASSWORD}
    hostname_pattern: x1-370
    hot_ssd_root: /media/scott/SSD_4TB/audio
    nas_mirror_root: /media/scott/NAS5

  # Generic/unmatched host profile. Network-specific Neo4j routing must be
  # supplied explicitly with NEO4J_URI rather than inherited accidentally.
  any:
    fileserver_root: /media/scott/SSD_4TB/fileserver
    neo4j_uri: bolt://localhost:7687
    neo4j_user: neo4j
    neo4j_password: ${NEO4J_PASSWORD}
    hostname_pattern: ""
    hot_ssd_root: /media/scott/SSD_4TB/audio
    nas_mirror_root: /media/scott/NAS5

  # deathstar-XPS-8920 — local 8TB HDD first-cache/processing layer plus NAS5 cold storage
  deathstar:
    fileserver_root: /mnt/8TB_2025/fileserver
    neo4j_uri: bolt://100.64.43.123:7687
    neo4j_user: neo4j
    neo4j_password: ${NEO4J_PASSWORD}
    hostname_pattern: deathstar
    hot_ssd_root: /mnt/8TB_2025/fileserver/audio
    nas_mirror_root: /media/scott/NAS5

# Knowledge Map System configuration (added 2026-05-30)
knowledge_map:
  central_vault_path: /home/scott/knowledge
  local_vault_path: /home/scott/nas-knowledge
  mirror_vault_path: /media/scott/NAS5/shared-knowledge
  canonical_vault_path: /media/scott/NAS5/shared-knowledge

  # Tailscale hostnames only; no raw peer IPs.
  vault_peers:
    - deathstar
    - demo-1
    - destroyer
    - optiplex

  peer_vault_path: /home/scott/nas-knowledge

  vault_sync:
    ssh_user: scott
    git_branch: main
    rsync_opts: "-a --delete"
    peer_timeout_sec: 8
    push_to_canonical: true

  git:
    enabled: true
    repo_url: "git@github.com:scottjoyner/knowledge-vault.git"
    branch: "main"
    auto_commit: true

  sync:
    neo4j_to_vault:
      enabled: true
      frequency: "30m"
      node_types:
        - Device
        - Service
        - Project
        - Infrastructure
        - Mapping
      confidence_threshold: 0.7
      max_nodes_per_sync: 100

    vault_to_neo4j:
      enabled: true
      frequency: "1h"
      scan_modified_only: true

# Resolution contract:
# 1. explicit environment overrides
# 2. hostname-matching machine profile
# 3. `any` generic profile
# 4. built-in localhost/default fallbacks
