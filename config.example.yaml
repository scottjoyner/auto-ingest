# auto-ingest configuration (EXAMPLE)
# Copy to config.yaml and customize per machine.
# Passwords/secrets are referenced via ${ENV_VAR} placeholders, not hardcoded.

# Nextcloud store (true iPhone images/videos/audio). Separate store, only
# mounted on some machines. Override with NEXTCLOUD_ROOT env.
nextcloud_root: /media/scott/SSD_4TB/nextcloud

# Nextcloud WebDAV connection (used by ingest_media.py / run_worker.sh).
# Password is pulled from the NEXTCLOUD_PASS env (do not hardcode secrets here).
nextcloud:
  webdav_url: "https://x1-370.tailcb8954.ts.net/nextcloud"
  user: admin
  pass_env: NEXTCLOUD_PASS

machine_paths:
  # x1-370 (home Tailscale node — Neo4j server lives here)
  x1-370:
    fileserver_root: /media/scott/SSD_4TB/fileserver
    shared_root: /nas
    neo4j_uri: bolt://100.64.43.123:7687
    neo4j_user: neo4j
    neo4j_password: ${NEO4J_PASSWORD}
    hostname_pattern: x1-370
    hot_ssd_root: /media/scott/SSD_4TB/audio
    nas_mirror_root: /nas

  # Any fleet node uses /nas for the shared data plane; local hot/cache roots may vary.
  any:
    fileserver_root: /media/scott/SSD_4TB/fileserver
    shared_root: /nas
    neo4j_uri: bolt://100.64.43.123:7687
    neo4j_user: neo4j
    neo4j_password: ${NEO4J_PASSWORD}
    hostname_pattern: ""
    hot_ssd_root: /media/scott/SSD_4TB/audio
    nas_mirror_root: /nas

  # deathstar-XPS-8920 — local first-cache plus /nas shared storage
  deathstar:
    fileserver_root: /mnt/8TB_2025/fileserver
    shared_root: /nas
    neo4j_uri: bolt://100.64.43.123:7687
    neo4j_user: neo4j
    neo4j_password: ${NEO4J_PASSWORD}
    hostname_pattern: deathstar
    hot_ssd_root: /mnt/8TB_2025/fileserver/audio
    nas_mirror_root: /nas

# SD-card ingest custody: logical destination + release-gate policy.
# The core logic never embeds a host mount. Set CUSTODY_DESTINATION_ROOT (or the
# value below) to whatever this host calls the canonical custody destination.
custody:
  destination_root: ${CUSTODY_DESTINATION_ROOT}
  destination_name: primary
  destination_relative_path: archive/dashcam
  policy:
    required_scope: all_inventory
    allow_hash_exemptions: true
    declared_hash_exemptions: []
    require_operator_witness: false
    strict_destination_scope: false
    require_destination_identity: true
    require_read_only_source: true
    require_mounted_destination: true

# Knowledge Map System configuration
knowledge_map:
  # Active working vault used by Hermes and knowledge_map.
  central_vault_path: /home/scott/knowledge
  # Local working copy for sync tools and scripts.
  local_vault_path: /home/scott/nas-knowledge
  # Durable NAS mirror for the vault and derived artifacts.
  mirror_vault_path: /nas/shared-knowledge
  canonical_vault_path: /nas/shared-knowledge
  git:
    enabled: true
    repo_url: "git@github.com:scottjoyner/knowledge-vault.git"
    branch: "main"
    auto_commit: true
  sync:
    neo4j_to_vault:
      enabled: true
      frequency: "30m"
      node_types:
        - Device
        - Service
        - Project
        - Infrastructure
        - Mapping
      confidence_threshold: 0.7
      max_nodes_per_sync: 100
    vault_to_neo4j:
      enabled: true
      frequency: "1h"
      scan_modified_only: true

# Auto-detection: the script will check the hostname and pick the matching config.
# If no match, it falls back to the first entry in machine_paths.
